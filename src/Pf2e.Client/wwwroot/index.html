<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pathfinder 2e Rules</title>
    <base href="/" />
    <meta name="theme-color" content="#0B4450" />
    <!-- Before the stylesheets, so the first paint is already in the chosen theme. Light unless
         somebody asked for dark: following the device put a dim room's phone into a dark app
         nobody chose. -->
    <script>
        document.documentElement.dataset.theme =
            (() => { try { return localStorage.getItem('theme'); } catch { return null; } })() === 'dark' ? 'dark' : 'light';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="_content/Pf2e.Components/css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Pf2e.Client.styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="boot">Loading the ruleset</div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Reload the page.
        <a href="" class="reload">Reload</a>
    </div>

    <script defer src="_content/Pf2e.Components/js/pf-components.js"></script>
    <script defer src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
